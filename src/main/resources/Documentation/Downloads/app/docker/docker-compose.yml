services:
  ss2015-tomcat:
    image:  nist775hit/ss2015-tool:1.7.3
    platform: linux/amd64
    ports:
      - "8087:8080"
    depends_on:
      ss2015-mysql:
        condition: service_healthy
        restart: true
    environment:
      - JAVA_OPTS=-Xmx4096m -Xms4096m -DRELOAD_DB=true -DCACHE_AT_STARTUP=false -DIS_DEV_TOOL=false
    restart: unless-stopped
    volumes:
      - ./tool_upload/:/tool_upload
      - ./logs/:/usr/local/tomcat/logs
    links:
      - ss2015-mysql:container-mysql

  ss2015-mysql:
    image: nist775hit/ss2015-mysql:1.7.3
    platform: linux/amd64
    ports:
      - "3321:3306"
    environment:
    - MYSQL_ROOT_PASSWORD=root_password
    restart: unless-stopped
    volumes:
      - ./db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD' ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s